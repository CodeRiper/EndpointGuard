<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EndpointGuard — Sign In</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
input{font:400 14px 'IBM Plex Sans',sans-serif;padding:11px 13px;border-radius:9px;border:1px solid rgba(255,255,255,.14);width:100%;background:rgba(255,255,255,.06);color:#fff}
input::placeholder{color:#777C98}
input:focus-visible{outline:2px solid #6D71F7;outline-offset:1px}
label{font:500 12.5px 'IBM Plex Sans',sans-serif;color:#9DA2BD;margin-bottom:6px;display:block}
.btn-primary{width:100%;font:600 14px 'IBM Plex Sans',sans-serif;padding:12px;border-radius:9px;border:none;background:linear-gradient(135deg,#6D71F7,#4347C9);color:#fff;cursor:pointer;box-shadow:0 4px 16px rgba(91,95,239,.4)}
.btn-primary:hover{filter:brightness(1.08)}
</style>
</helmet>
<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Sans',sans-serif;background:radial-gradient(ellipse at top,#1B1D30,#0B0C14 60%);">

  <div style="width:380px;display:flex;flex-direction:column;gap:26px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;">
      <span style="width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,#6D71F7,#4347C9);display:flex;align-items:center;justify-content:center;color:#fff;font:700 18px 'Space Grotesk',sans-serif;box-shadow:0 6px 20px rgba(91,95,239,.45);">EG</span>
      <div style="text-align:center;">
        <div style="font:600 19px 'Space Grotesk',sans-serif;color:#fff;">EndpointGuard</div>
        <div style="font-size:12.5px;color:#8389AC;margin-top:2px;">Fleet control dashboard</div>
      </div>
    </div>

    <div style="background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:26px 24px;display:flex;flex-direction:column;gap:16px;backdrop-filter:blur(8px);">

      <div>
        <label for="srv">Server address</label>
        <input type="text" id="srv" placeholder="10.20.1.5:8080" class="mono" style="font-family:'IBM Plex Mono',monospace;">
      </div>
      <div>
        <label for="u">Username</label>
        <input type="text" id="u" placeholder="admin" autocomplete="username">
      </div>
      <div>
        <label for="p">Password</label>
        <input type="password" id="p" placeholder="••••••••••••" autocomplete="current-password">
      </div>

      <button class="btn-primary" type="button" style="margin-top:6px;">Sign In</button>

      <p style="margin:0;font-size:11.5px;color:#6B7088;line-height:1.5;text-align:center;">
        First time? The server prints a one-time admin password to its log on first run.
      </p>
    </div>

    <p style="margin:0;text-align:center;font-size:11.5px;color:#565B78;">EndpointGuard · connects over TLS 1.3 · port set by your admin</p>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

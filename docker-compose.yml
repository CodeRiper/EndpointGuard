version: "3.9"

# Starts the two databases needed for local development.
# The EndpointGuard server and agent are NOT in this file —
# they run as native binaries (server on Linux, agent on Windows).

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: eg-clickhouse
    ports:
      - "9000:9000"   # native protocol  (Go client)
      - "8123:8123"   # HTTP interface   (browser / curl)
    environment:
      CLICKHOUSE_DB:       endpointguard
      CLICKHOUSE_USER:     default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./db/clickhouse.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/clickhouse_config/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: eg-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER:     eg
      POSTGRES_PASSWORD: eg
      POSTGRES_DB:       endpointguard
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eg -d endpointguard"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ch_data:
  pg_data:
